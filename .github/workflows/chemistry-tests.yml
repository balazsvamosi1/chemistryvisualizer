name: Chemistry Lab tests
on:
  push:
    branches: [fix/**]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run JavaScript regression tests
        run: node --test tests/*.test.cjs
      - name: Verify real density canvas pixels in Chromium
        run: node tests/density-browser-smoke.cjs
